<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AICE 실습장 안내</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const path = window.location.pathname.toLowerCase();
    if (path.includes("marine")) {
      window.location.replace("/aice-quest/marine/");
    } else if (path.includes("heung")) {
      window.location.replace("/aice-quest/heung/");
    } else {
      window.location.replace("/aice-quest/");
    }
  </script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4 text-center">
  <div class="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full border border-slate-200 space-y-4">
    <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-2xl">
      <i class="fa-solid fa-compass animate-spin"></i>
    </div>
    <h1 class="text-xl font-black text-slate-900">AICE 실습장으로 연결 중...</h1>
    <p class="text-xs text-slate-500">잠시 후 자동으로 학교별 실습 포털로 이동합니다.</p>
    <div class="pt-4 border-t border-slate-100 flex flex-col space-y-2 text-xs font-bold">
      <a href="/aice-quest/heung/" class="py-2.5 bg-indigo-600 text-white rounded-xl">A학교 실습장 바로가기</a>
      <a href="/aice-quest/marine/" class="py-2.5 bg-teal-600 text-white rounded-xl">B학교 실습장 바로가기</a>
      <a href="/aice-quest/" class="py-2.5 bg-slate-100 text-slate-700 rounded-xl">포털 메인 바로가기</a>
    </div>
  </div>
</body>
</html>
